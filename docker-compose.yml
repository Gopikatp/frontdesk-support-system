services:
  db:
    image: postgres:16
    container_name: frontdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: frontdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - frontdesk_pgdata:/var/lib/postgresql/data
volumes:
  frontdesk_pgdata:
